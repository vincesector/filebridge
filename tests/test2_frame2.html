<!doctype html><html><body><input id="xinput" type="file">
<script>document.getElementById('xinput').addEventListener('change', async e => { const f = e.target.files[0];
  const tail = await f.slice(Math.max(0, f.size - 1048576)).arrayBuffer(); const h = await crypto.subtle.digest('SHA-256', tail);
  const hex = [...new Uint8Array(h)].map(b => b.toString(16).padStart(2, '0')).join('');
  parent.postMessage(`xframe|${f.name}|${f.size}|${hex}`, '*'); });</script></body></html>
