[project]
name = "filebridge"
version = "0.1.0"
description = "MCP server and CLI that moves files of any size: rclone transfers, no-size-cap browser uploads over CDP, and uploads through your own signed-in browser"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
keywords = ["mcp", "model-context-protocol", "file-upload", "rclone", "chrome-devtools-protocol", "claude-code", "codex", "browser-automation"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: MacOS",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Internet :: File Transfer Protocol (FTP)",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
requires-python = ">=3.12"
dependencies = [
    "mcp>=2.3.0",
    "websockets>=17.3",
]

[project.urls]
Homepage = "https://github.com/vincesector/filebridge"
Repository = "https://github.com/vincesector/filebridge"
Issues = "https://github.com/vincesector/filebridge/issues"

[project.scripts]
filebridge = "filebridge.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["filebridge"]
